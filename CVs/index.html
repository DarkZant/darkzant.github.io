<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CVs</title>
  <link rel="icon" href="../Images/CV.png">
  <style>
    body {
        background-color: #1d1a14;
        margin: 0;
        overflow: hidden;
        font-family: "Futura", "Sans-serif";
    }
    main {
        width: 100dvw;
        height: 100dvh;
        display: flex;      
    }
    a {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #c0c0c0;
        font-size: 5vmax;
        text-decoration: none;
    }
    a:hover {
        background-color: #2f2f2f;
        text-decoration: underline;
        color: #dadada;
    }
    #separator {
        background-color: #c0c0c0;
        border-radius: 2vmax;
    }
    @media (max-aspect-ratio: 1/1) {
        main {
            flex-direction: column;
        }
        a {
            width: 100%;
            height: 50%;
        }
        #separator {
            width: 100%;    
            height: 0.5%; 
        }
    }

    @media (min-aspect-ratio: 1/1) {
        main {
            flex-direction: row;
        }
        a {
            width: 50%;
            height: 100%;
        }
        #separator {
            width: 0.5%;   
            height: 100%;
        }
    }
  </style>

</head>
<body>
    <main>
       <a id="fr" href="CV_FR.pdf">Français</a>
       <div id="separator"></div>
       <a id="en" href="CV_EN.pdf">English</a> 
    </main>
</body>
</html>

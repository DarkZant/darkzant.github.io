<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>llm4mesen</title>
    <link rel="icon" href="../Images/smb.png">
    <style>
        body {
            background-color: #1d1a14;
            margin: 0;
            overflow: hidden;
            font-family: "Futura", "Sans-serif";
            color: #c0c0c0;
        }
        main {
            width: 100dvw;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;  
            row-gap: 5%;    
        }
        h1 {
            font-size: 5vmax;
            margin: 0;
        }
        h2 {
            font-size: 2vmax;
            max-width: 55%;
            margin: 0;
        }
        #desc {
            text-align: center;
        }
        #desc a {
            color: #c0c0c0;
        }
        #desc a:hover {
            color: #f1f1f1;
        }
        #links {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            column-gap: 5dvw;
        }
        a {
            color: #24bcfd
        }
        a:hover {
            color: #0033fd;
        }
        iframe {
            width: 32.5%;
            min-width: 400px;
            aspect-ratio: 4 / 3;
            border: #c0c0c0 0.5vmin solid;
            border-radius: 0.5vmin;
        }
    </style>
</head>
<body>
    <main>
        <h1>llm4mesen</h1>
        <h2 id="desc">An LLM-to-game pipeline for playing and evaluating large language models on classic 2D games via the <a href="https://www.mesen.ca/">Mesen</a> emulator.</h2>
        <h2 id="links">
            <a href="paper.pdf">Paper</a>
            <a href="https://www.github.com/darkzant/llm4mesen">Github Repository</a>
        </h2>
        <iframe 
            src="https://www.youtube.com/embed/NMzPKq6oF2g?autoplay=1&mute=1&loop=1&playlist=NMzPKq6oF2g"
            title="Presentation Video"
            frameborder="0"
            allowfullscreen
        ></iframe>
    </main>
</body>
</html>
